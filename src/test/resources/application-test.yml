spring:
  datasource:
    url: jdbc:h2:mem:rbpolab3;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

security:
  jwt:
    secret: test-only-jwt-secret-with-at-least-32-bytes-2026
    access-ttl: PT15M
    refresh-ttl: P7D

server:
  ssl:
    enabled: false
    key-store-password: unused-in-mockmvc
