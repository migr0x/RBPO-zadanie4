spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rbpo-lab4-variant27
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/news_editorial_db}
    username: ${DB_USERNAME:news_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${TLS_KEYSTORE:file:./tls/local/lab6-server.p12}
    key-store-type: PKCS12
    key-store-password: ${TLS_KEYSTORE_PASSWORD}
    key-alias: lab6-server
    enabled-protocols: TLSv1.3

security:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
